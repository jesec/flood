name: build-binary

on:
  workflow_call:
    inputs:
      package-artifact:
        description: Artifact name containing the npm package tarball
        required: false
        default: npm-package
        type: string
      node-version:
        description: Node.js version to use
        required: false
        default: '22'
        type: string
      upload-name:
        description: Artifact name for the generated binaries
        required: false
        default: pkg-binaries
        type: string
  workflow_dispatch:
    inputs:
      package-artifact:
        description: Artifact name containing the npm package tarball
        required: false
        default: npm-package
        type: string
      node-version:
        description: Node.js version to use
        required: false
        default: '22'
        type: string
      upload-name:
        description: Artifact name for the generated binaries
        required: false
        default: pkg-binaries
        type: string

jobs:
  pkg:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs['package-artifact'] }}
          path: artifacts

      - name: Locate package tarball
        id: package
        run: echo "tarball=$(ls artifacts/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Extract package contents
        run: |
          mkdir package
          tar -xzf "${{ steps.package.outputs.tarball }}" -C package --strip-components=1
          cp pnpm-lock.yaml package/

      - uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs['node-version'] }}
          cache: pnpm
          cache-dependency-path: package/pnpm-lock.yaml

      - name: Install build dependencies
        working-directory: package
        run: pnpm install --frozen-lockfile

      - name: Set up QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --reinstall -y qemu-user-static

      - name: Install ldid
        run: |
          sudo wget https://github.com/jesec/ldid-static/releases/download/v2.1.4/ldid-amd64 -O /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Install pkg
        run: pnpm add -g --config.global-bin-dir="$PNPM_HOME" @yao-pkg/pkg

      - name: Build executables
        working-directory: package
        run: pnpm run pkg

      - name: Normalize linux artifact names
        working-directory: package
        run: |
          if [ -f dist-pkg/flood-linuxstatic-x64 ]; then
            mv dist-pkg/flood-linuxstatic-x64 dist-pkg/flood-linux-x64
          fi
          if [ -f dist-pkg/flood-linuxstatic-arm64 ]; then
            mv dist-pkg/flood-linuxstatic-arm64 dist-pkg/flood-linux-arm64
          fi

      # the ICU data has to sit next to the executables: everything uploaded below then shares
      # dist-pkg as the artifact root, which keeps the artifact and the release assets flat
      - name: Fetch ICU data
        working-directory: package
        env:
          # must match process.versions.icu of the Node.js bundled in the executables
          ICU_DATA_VERSION: '78.2'
        run: |
          curl -fsSL -o icu-data.zip \
            "https://github.com/unicode-org/icu/releases/download/release-${ICU_DATA_VERSION}/icu4c-${ICU_DATA_VERSION}-data-bin-l.zip"
          unzip -j -o icu-data.zip icudt78l.dat LICENSE -d dist-pkg
          mv dist-pkg/LICENSE dist-pkg/icudt78l.dat.LICENSE
          rm icu-data.zip

      - name: Verify executables work with ICU data
        working-directory: package
        run: NODE_ICU_DATA="$PWD/dist-pkg" ./dist-pkg/flood-linux-x64 --help > /dev/null

      - name: Upload pkg artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs['upload-name'] }}
          path: |
            package/dist-pkg/flood-linux-x64
            package/dist-pkg/flood-linux-arm64
            package/dist-pkg/flood-macos-x64
            package/dist-pkg/flood-macos-arm64
            package/dist-pkg/flood-win-x64.exe
            package/dist-pkg/flood-win-arm64.exe
            package/dist-pkg/icudt78l.dat
            package/dist-pkg/icudt78l.dat.LICENSE
          if-no-files-found: error
